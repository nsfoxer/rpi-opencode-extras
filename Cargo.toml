[package]
name = "rpi-opencode-extras"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 必须与宿主 rpi 0.22.1 同版本（插件 ABI 4）；provider feature 才带 provider 桥接
rpi-plugin-sdk = { version = "=0.22.1", features = ["provider"] }
rpi-ai = "=0.22.1"
serde_json = "1"
async-trait = "0.1"
url = "2"
# msys2-bash feature 用：配置反序列化（serde derive）+ 命令黑名单匹配
serde = { version = "1", features = ["derive"] }
regex = "1"
# deepseek-search feature 用：HTTP 请求（rustls，不引入 OpenSSL）
ureq = { version = "2", features = ["json", "tls"] }
# notify feature 用：桌面通知（D-Bus org.freedesktop.Notifications，zbus）
notify-rust = "4"
